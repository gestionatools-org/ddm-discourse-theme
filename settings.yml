# Functional configuration only. Display strings live in locales/en.yml.
#
# Every homepage lane is keyed by category ID, never by slug. On this instance
# the slugs are legacy and no longer describe their category — id 4
# "Te contamos..." is `comunidad-expertos`, id 5 "El foro del Certificado" is
# `grupos-de-trabajo`, id 50 "Analiza" is `analitica-datos`. A slug rename would
# silently empty a lane; an ID rename is not a thing.
#
# IDs also survive reparenting, so promoting a subcategory to top level is free.
# A category reorganisation still breaks these settings three ways, and only the
# first one announces itself:
#
#   deleted or merged  -> c/<id>/l/latest 404s and the lane shows an error
#   emptied by a move  -> the lane renders its <:empty> state, silently
#   repurposed         -> the lane renders the wrong topics, silently
#
# Re-check every ID below by hand after any category reorganisation. The two
# silent modes are indistinguishable from a quiet category, so nothing in the
# theme or in CI will report them.
#
# Discourse has no single-category setting type, so these are plain integers
# (same as discourse-theme-skills' `sidebar_category_id`). 0 disables the lane.

# --- Lane 1: news -----------------------------------------------------------
# Site-wide `latest`, with no category setting at all. It used to be keyed on
# category 4, which made it 57% arrival announcements because 4's listing
# carried category 78's 164 topics. Being category-free also makes it the one
# lane a taxonomy change cannot empty.
news_count:
  type: integer
  default: 4
  min: 1
  max: 10

# --- Lane 2: the certification forum ----------------------------------------
# Parent of the ideas subcategory, whose topics are included.
forum_category_id:
  type: integer
  default: 5

forum_count:
  type: integer
  default: 6
  min: 1
  max: 15

# --- Lane 3: ideas ----------------------------------------------------------
# The same block as lane 2, pointed at a different category. Category 18 is the
# largest on the site (318 topics, 3.6 replies/topic) and was buried as a
# subcategory of 5, so the forum lane printed it and it had no heading of its
# own. The reorganisation promotes it to top level; this lane gives it a voice.
#
# The forum lane deliberately does NOT also point here: with a lane each, one
# category pointing at both would print the same 318 topics twice on one page.
ideas_category_id:
  type: integer
  default: 18

ideas_count:
  type: integer
  default: 6
  min: 1
  max: 15

# --- Lane 4: showcase -------------------------------------------------------
# Rendered as an image grid, so point this at a category whose topics carry a
# cover image. Topics without one degrade to a text card.
showcase_category_id:
  type: integer
  default: 78

showcase_count:
  type: integer
  default: 6
  min: 2
  max: 12

# Restricts the grid to one tag, on top of the category above. Sent to the
# server as a `tags` param, so it selects across the whole category rather than
# trimming the page already fetched — see loadCategoryTopics.
#
# It exists because category 78 is not a gallery: every one of its topics is an
# arrival announcement, and only about a third of them carry the member's
# poster. Measured 2026-08-27 over the API: 149 topics, 17 with the poster
# embedded as an image, 36 with it attached as a PDF, 98 with neither. The tag
# is what tells them apart; the image requirement then decides what the grid can
# actually hang.
#
# `poster-evf` is the certification's *evaluación final* poster specifically,
# renamed from the flat `posters` on 2026-08-27 so that posters tied to an event
# can carry their own tag — `poster-congreso-2025` for the III Encuentro — rather
# than being conflated with the ones the programme evaluates. That is why the
# name is narrow: this lane exhibits member work from the certification, and a
# congress compilation is a different thing that would otherwise land in it.
#
# Empty disables the filter and the lane falls back to the whole category. An
# unknown tag empties the lane silently — which is exactly what a tag rename
# does, so this default has to be changed in the same pass as the rename.
showcase_tag:
  type: string
  default: "poster-evf"

# --- Lane 5: events ---------------------------------------------------------
# A category listing that carries real event dates where they exist.
# `discourse-calendar` was enabled on this site on 2026-08-12, so
# `event_starts_at` reaches `topic_list_item` for every topic whose first post
# carries an `[event]` block — and only for those. The lane renders both kinds
# from the one request: the event date where it is serialized, the topic date
# otherwise, and it groups the result into upcoming and past.
# See javascripts/discourse/blocks/block-events.gjs.
events_category_id:
  type: integer
  default: 59

events_count:
  type: integer
  default: 4
  min: 1
  max: 10

# --- Lane 6: library --------------------------------------------------------
# Reference categories rendered as directory cards rather than topic lists.
# Their topics have essentially zero replies (id 73's whole tree: 66 topics,
# 0 replies ever), so "latest topic" carries no signal and a list would be a
# misleading affordance.
library_category_ids:
  type: list
  list_type: category
  default: "73|85|14"

# --- Header links -----------------------------------------------------------
# Destination links shown in the site header, between the search field and the
# user icons. Labels are NOT here: they live in locales/*.yml under
# `header.links`, per the settings/strings split.
#
# A link with an empty URL is not rendered, so the header stays clean until a
# destination is decided. `type: string` rather than a URL type because
# Discourse has none, and these may be absolute (an external Academy) or
# relative (a category on this instance).
#
# Below lg the whole nav is hidden: the header already carries a logo, a
# search field and the user icons, and more labels squeeze the search to
# nothing. Filling all three URLs tightens the wide layout too — two is what
# the current design was checked against.
#
# That flexibility has a trap, and it has already been sprung once: the value
# reaches the DOM as `href` after nothing but a trim, so an absolute
# destination typed without its scheme — `demo-a.example.com` rather than
# `https://demo-a.example.com` — is not read as a host at all. The browser
# resolves it against the current page and requests
# `https://this-forum/demo-a.example.com`, which 404s. The setting descriptions
# in locales/en.yml say so; there is no validation to lean on, because
# `validations: { url: true }` exists only for properties inside a
# `type: objects` schema, and converting these three would discard the values
# admins have already stored.
academy_url:
  type: string
  default: ""

demo_url:
  type: string
  default: ""

first_steps_url:
  type: string
  default: ""
