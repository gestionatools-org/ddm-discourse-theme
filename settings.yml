# Functional configuration only. Display strings live in locales/en.yml.
#
# The panel's two lanes — events and ideas — are keyed by category ID, never by
# slug. On this instance the slugs are legacy and no longer describe their
# category: id 18 "Tengo una idea" is `ideas-gestiona`, id 59 "Eventos" is
# `eventos`. A slug rename would silently empty a lane; an ID rename is not a
# thing. IDs also survive reparenting, so promoting a subcategory to top level
# is free.
#
# A category reorganisation still breaks these settings three ways, and only the
# first one announces itself:
#
#   deleted or merged  -> c/<id>/l/latest 404s and the lane shows an error
#   emptied by a move  -> the lane renders its <:empty> state, silently
#   repurposed         -> the lane renders the wrong topics, silently
#
# Re-check both IDs by hand after any category reorganisation. The two silent
# modes are indistinguishable from a quiet category, so nothing in the theme or
# in CI will report them.
#
# Discourse has no single-category setting type, so these are plain integers
# (same as discourse-theme-skills' `sidebar_category_id`). 0 disables the lane.

# --- The hero band's "New post" button ---------------------------------------
# Which category the composer opens on when the page names none of its own —
# the homepage and the generic listings. A category page always wins over this.
#
# Not a cosmetic default: with no category core falls back to
# `default_composer_category` and then to the first category the user may write
# in, which here is 4 "Noticias". The band invites a member to start a thread,
# and that belongs in 5 "Foro del certificado".
#
# Same three silent failure modes as the lane IDs above, plus one of its own: a
# user without create permission in this category falls back to no
# preselection, so a mis-set ID looks like nothing happened rather than like an
# error. 0 restores core's own default.
hero_default_category_id:
  type: integer
  default: 5

# --- Section 1: the latest list ---------------------------------------------
# Site-wide `latest`, with no category setting at all. It used to be keyed on
# category 4, which made it 57% arrival announcements because 4's listing
# carried category 78's 164 topics. Being category-free also makes it the one
# lane a taxonomy change cannot empty.
#
# Rendered with core's own topic list, so a row costs less vertical space than
# the old title-plus-excerpt did and the default is higher than the 4 it was.
latest_count:
  type: integer
  default: 8
  min: 1
  max: 20

# --- Section 1's panel: events ---------------------------------------------
# "Agenda del certificado" — category 59, in the slot the shortcuts card used
# to hold. BlockEvents splits the listing client-side into upcoming and past:
# category 59 carries `sort_topics_by_event_start_date` but the listing it
# serves is still `bumped_at` descending, so the split has to be done here or
# the next date gets buried under write-ups of past ones. See
# javascripts/discourse/blocks/block-events.gjs.
events_category_id:
  type: integer
  default: 59

events_count:
  type: integer
  default: 4
  min: 1
  max: 10

# --- Section 1's panel: certified users ---------------------------------------
# The newest certification posters — topics tagged `poster_carousel_tag` — from
# this category and its subcategories, newest first by creation date. 85 is
# Comparte on both PROD and PRE (2026-10-09). The lane's footer links to the
# category's own "About" topic.
certified_category_id:
  type: integer
  default: 85
  min: 1

# Rows are fixed-height (a 2.75rem chip, one-line title, grey line), like the
# events lane. Six matched the ideas lane this replaced: measured 2026-10-09 with
# PROD's compiled CSS, 529px vs 520px at a 428px panel, 578px vs 611px at 324px.
certified_count:
  type: integer
  default: 6
  min: 1
  max: 15

# --- Header links -----------------------------------------------------------
# One link per programme room, in the site header beside the search icon. Each
# id is resolved against the categories the viewer can see (`site.categories`),
# so a member outside a room's group never gets its link — no permission logic
# lives in the theme. The label is the category's own name and the href its own
# URL, so a rename or a slug change in admin reaches the header with no deploy.
#
# The default is PRE's room ids. The rooms do not exist on PROD yet: set this
# there once they are created — it is part of the category-id parity check that
# gates installing the theme on PROD.
#
# Below lg the nav is hidden; the rooms are in the default sidebar instead.
header_room_category_ids:
  type: list
  list_type: category
  default: "89|90|91"

# --- Section 2: community highlights ---------------------------------------
# Four cards below section 1: latest podcast, latest newsletter, latest Gestiona
# release, and the month's most active member. The three tag settings are matched
# by slug, exactly as in /tag/<slug>. Each hides its card when empty; a card
# whose tag is set but currently has no topic shows a "coming soon" placeholder.
#
# The section renders only when at least one of the three tags is non-empty —
# the member card is a companion, never the sole reason to show the section.
# Emptying all three hides it, the same idiom as events_category_id: 0.
#
# A renamed tag empties its card in silence, the same failure mode the category
# IDs above carry. Re-check the three slugs after any tag reorganisation, and
# point them at the base tag: a synonym's listing 301s, so keeping the old name
# as a synonym does not keep the card alive.
highlights_podcast_tag:
  type: string
  default: "podcast"

highlights_newsletter_tag:
  type: string
  default: "newsletter"

# Renamed from nueva-version-gestiona on 2026-10-05; the old name and
# nuevas-versiones survive as synonyms. Set empty to drop the card entirely.
highlights_news_tag:
  type: string
  default: "version-gestiona"

# Rolling window for the "most active member" ranking. Discourse's directory has
# no calendar-month period — "monthly" is the last 30 days, the same window the
# topbar figures use ("Este mes:").
highlights_member_period:
  type: enum
  default: monthly
  choices:
    - monthly
    - quarterly
    - yearly
    - all

# Which user field carries the member's organisation and which carries their job
# title, by numeric id. They are ids rather than names because that is what
# `/u/<username>.json` keys `user_fields` by, and they are settings rather than
# constants because the ids are per-instance — PRE's are 2 and 4, and PROD's are
# unread. Set either to 0 to drop that line from the member card.
#
# NEVER render `user_fields` wholesale to cover these: on PRE, fields 1 and 3 are
# a NIF and a CIF with `show_on_profile: false`, and an administrator's session
# receives them anyway. Reading the two ids explicitly is what keeps a national
# ID off the homepage.
highlights_member_entity_field_id:
  type: integer
  default: 2

highlights_member_role_field_id:
  type: integer
  default: 4

# The "Centro de ayuda" row at the top of the sidebar, by category id. Its label
# and URL are the category's own. 78 predates PRE's restore, so it is the same
# category on both instances. 0 hides the row.
getting_started_category_id:
  type: integer
  default: 78
  min: 0

# The two ways out for a visitor who cannot sign in, shown on the login landing
# and under the /login form. Registration is closed, so these are the only
# answers the site gives to "how do I get in?". Blank hides that exit; both
# blank hides the whole "¿No puedes acceder?" section.
access_contact_email:
  type: string
  default: "certificaciongestiona@espublico.com"

certification_url:
  type: string
  default: "https://www.espublicogestiona.com/es/certificaciones-espublico/"

# The poster carousel above the topic list, by category id. Each listed
# category shows the posters of its whole subtree, so the parent shows all of
# them and each child only its own. Ids rather than names because they are
# per-instance: PROD's Comparte is 85 with children 94, 83 and 93; PRE's are
# 85, 93, 83 and 92. Empty hides the carousel everywhere.
poster_carousel_category_ids:
  type: list
  list_type: category
  default: "85|94|83|93"

# Only topics carrying this tag become posters. Matched server-side.
poster_carousel_tag:
  type: string
  default: "poster-evf"

poster_carousel_count:
  type: integer
  default: 12
  min: 1
  max: 30

# Below this many posters with an image the carousel is not shown: a strip of
# one or two reads as broken rather than as a gallery.
poster_carousel_min:
  type: integer
  default: 3
  min: 1
