es:
  theme_metadata:
    description: "Tema de Discourse para la comunidad de es|public."
    settings:
      latest_count: "Cuántos temas mostrar en la lista de últimas publicaciones."
      events_category_id: "Categoría que se muestra en la franja de eventos del panel. Incluye sus subcategorías. 0 oculta la franja."
      events_count: "Cuántos eventos mostrar en la franja del panel."
      ideas_category_id: "Categoría que se muestra en el panel, junto a las últimas publicaciones. Incluye sus subcategorías. 0 lo oculta."
      panel_ideas_count: "Cuántas ideas mostrar en el panel."
      academy_url: "Adónde apunta el enlace Academy de la cabecera. Los destinos externos deben llevar el esquema — https://ejemplo.com, no ejemplo.com, que el navegador resuelve como una ruta de este sitio. Empieza por / para una página de este foro. Vacío oculta el enlace."
      demo_url: "Adónde apunta el enlace Demo Gestiona de la cabecera. Los destinos externos deben llevar el esquema — https://ejemplo.com, no ejemplo.com, que el navegador resuelve como una ruta de este sitio. Empieza por / para una página de este foro. Vacío oculta el enlace."
      first_steps_url: "Adónde apunta el enlace de primeros pasos de la cabecera. Los destinos externos deben llevar el esquema — https://ejemplo.com, no ejemplo.com, que el navegador resuelve como una ruta de este sitio. Empieza por / para una página de este foro. Vacío oculta el enlace."
      highlights_podcast_tag: "Etiqueta cuyo tema más reciente ocupa la tarjeta de podcast. Se compara por slug. Vacío oculta la tarjeta."
      highlights_newsletter_tag: "Etiqueta cuyo tema más reciente ocupa la tarjeta de newsletter. Se compara por slug. Vacío oculta la tarjeta."
      highlights_news_tag: "Etiqueta cuyo tema más reciente ocupa la tarjeta «Novedad de Gestiona». Se compara por slug. Vacío oculta la tarjeta."
      highlights_member_period: "Ventana para el ranking del miembro más activo. «monthly» son los últimos 30 días — Discourse no ofrece mes natural."

  header:
    links:
      aria_label: "Enlaces destacados"
      academy: "Academy"
      demo: "Demo Gestiona"
      first_steps: "Primeros pasos"

  topbar:
    stats:
      aria_label: "Actividad de la comunidad"
      # Stated once, in front of the three 30-day figures. Each of those used
      # to carry its own "este mes", which repeated the phrase and still left
      # the active-users figure unqualified.
      period_label: "Este mes:"
      period_aria_label: "Actividad este mes"
      members:
        one: "miembro"
        other: "miembros"
      active:
        one: "usuario activo"
        other: "usuarios activos"
      posts:
        one: "mensaje"
        other: "mensajes"
      # "me gusta" as a noun is invariable in Spanish, so both plural forms are
      # identical on purpose — "2 me gustas" is colloquial and Discourse's own
      # Spanish locale does not use it.
      likes:
        one: "me gusta"
        other: "me gusta"

  # La banda de cabecera de la portada y de cada listado. Una página de
  # categoría sustituye ambos textos por su propio nombre y descripción, así que
  # esto es lo que se ve en /latest, /top y /unread.
  hero:
    home:
      title: "Seguimos aprendiendo juntos"
      subtitle: "Comparte tus ideas o recibe consejos de otros usuarios certificados"
    tag:
      title: "Temas etiquetados %{tag}"
      subtitle: "Todo lo que la comunidad ha guardado bajo esta etiqueta"
    button: "Nueva publicación"

  homepage:
    latest:
      title: "Últimas publicaciones"
      link_text: "Ver todas"
      empty: "Todavía no hay publicaciones."
    events:
      title: "Agenda del certificado"
      link_text: "Ver agenda"
      empty: "No hay eventos programados."
      # Group headings. The lane is a record as much as an announcement, so
      # both halves are labelled rather than merged into one undated run.
      upcoming: "Próximamente"
      past: "Celebrados"
    ideas:
      title: "Tengo una idea"
      link_text: "Comparte tu idea"
      empty: "Todavía no hay ideas."
    # Lo renderiza BlockForum para la franja de ideas. `empty` es el valor por
    # defecto del arg del componente (la franja de ideas lo sustituye por
    # `ideas.empty`); `replies` se lee directamente desde la plantilla.
    forum:
      empty: "Todavía no hay conversaciones."
      replies:
        one: "%{count} respuesta"
        other: "%{count} respuestas"
    highlights:
      title: "Destacado de la comunidad"
      soon: "Próximamente"
      podcast:
        label: "Podcast"
        cta: "Ver el episodio"
        play: "Reproducir el episodio"
      newsletter:
        label: "Newsletter"
        cta: "Leer la newsletter"
      news:
        label: "Novedad de Gestiona"
        cta: "Ver la novedad"
      member:
        badge: "Miembro del mes"
        posts:
          one: "%{count} publicación"
          other: "%{count} publicaciones"
        likes:
          one: "%{count} me gusta"
          other: "%{count} me gusta"
        days:
          one: "%{count} día activo"
          other: "%{count} días activos"
        profile: "Ver perfil"
        cta_empty: "Publica y participa este mes para aparecer aquí"
        cta_empty_button: "Escribir una publicación"
