en:
  theme_metadata:
    description: "Custom Discourse theme for the es|public community."
    settings:
      hero_default_category_id: "Category the 'Start a conversation' button preselects on the homepage and the generic listings. A category page uses its own instead. 0 falls back to Discourse's default composer category."
      latest_count: "How many topics to show in the latest list."
      events_category_id: "Category shown in the events lane in the panel. Its subcategories are included. 0 hides the lane."
      events_count: "How many events to show in the panel lane."
      ideas_category_id: "Category shown in the panel beside the latest list. Its subcategories are included. 0 hides it."
      panel_ideas_count: "How many ideas to show in the panel beside the latest list."
      ideas_tag: "Only topics carrying this tag fill the ideas panel. Matched server-side across the whole category. Empty shows the whole category instead."
      header_room_category_ids: "Programme rooms linked from the site header, in order. Each link shows only to members who can see that category, and is labelled with the category's name. Empty hides the links."
      highlights_podcast_tag: "Tag whose most recent topic fills the podcast card. Matched by slug. Empty hides the card."
      highlights_newsletter_tag: "Tag whose most recent topic fills the newsletter card. Matched by slug. Empty hides the card."
      highlights_news_tag: "Tag whose most recent topic fills the 'What's new in Gestiona' card. Matched by slug. Empty hides the card."
      highlights_member_period: "Window for the most-active-member ranking. 'monthly' is the last 30 days — Discourse has no calendar-month option."
      highlights_member_entity_field_id: "Numeric id of the user field holding the member's organisation, shown on the member card. 0 hides the line. Ids are per-instance — check them before installing on another site."
      highlights_member_role_field_id: "Numeric id of the user field holding the member's job title, shown on the member card. 0 hides the line. Never widen this to read every user field: some carry identity documents that only administrators receive."
      getting_started_category_id: "Category linked at the top of the sidebar, labelled with its own name. Only members who can see it get the link. 0 hides it."
      getting_started_max_trust_level: "Highest trust level that still sees the sidebar link. 1 shows it to new and basic members only."
      access_contact_email: "Address for certified users who cannot sign in. Shown on the login landing and under the /login form. Blank hides that exit."
      certification_url: "Page about Gestiona certifications, for visitors who do not hold one yet. Opens in a new tab. Blank hides that exit."

  header:
    links:
      aria_label: "Certification forums"

  topbar:
    stats:
      aria_label: "Community activity"
      # Stated once, in front of the two 30-day figures. Each of those used
      # to carry its own "this month", which repeated the phrase and still
      # left the active-users figure unqualified.
      period_label: "This month:"
      period_aria_label: "Activity this month"
      members:
        one: "member"
        other: "members"
      # The lifetime count of listable topics — what a reader can actually
      # reach, which is why it is worth stating next to the member count.
      topics:
        one: "topic"
        other: "topics"
      active:
        one: "active user"
        other: "active users"
      # "messages" and not "replies": the stat behind it is a bare Post query
      # that includes private messages and restricted categories, so "replies"
      # would be a claim the number cannot support.
      posts:
        one: "message"
        other: "messages"

  # The heading band at the top of the homepage and every listing. A category
  # page overrides both strings with its own name and description, so these are
  # the fallback the community sees on /latest, /top and /unread.
  hero:
    home:
      title: "Connect with the community"
      subtitle: "Find support from professionals and the Gestiona team. Ask your question and move forward with confidence."
    tag:
      title: "Topics tagged %{tag}"
      subtitle: "Everything the community has filed under this tag"
    button: "Start a conversation"

  homepage:
    latest:
      title: "Latest posts"
      # Unused today: the homepage stopped passing `linkUrl` to the latest
      # lane, so the heading carries no button. Kept because the block still
      # takes the arg — restoring it must not surface a raw key.
      link_text: "See all"
      empty: "Nothing new yet."
    events:
      title: "What's on"
      # Unused today: the homepage stopped passing `linkUrl` to the events
      # lane, so no footer button renders. Kept because the block still takes
      # the arg — restoring the button must not surface a raw key.
      link_text: "See the calendar"
      empty: "No events scheduled."
      # Group headings. The lane is a record as much as an announcement, so
      # both halves are labelled rather than merged into one undated run.
      upcoming: "Coming up"
      past: "Past events"
    ideas:
      title: "Latest ideas posted"
      link_text: "Share an idea"
      empty: "No ideas yet."
    # Rendered by BlockForum for the ideas lane. `empty` is the component's arg
    # default (the ideas lane overrides it with `ideas.empty`); `replies` is
    # read straight from the template.
    forum:
      empty: "No conversations yet."
      replies:
        one: "%{count} reply"
        other: "%{count} replies"
    highlights:
      title: "Community highlights"
      soon: "Coming soon"
      podcast:
        label: "Podcast"
        cta: "Watch the episode"
        play: "Play the episode"
      newsletter:
        label: "Newsletter"
        cta: "Read the newsletter"
      news:
        label: "The latest from Gestiona"
        cta: "See what's new"
      member:
        badge: "Featured certified member"
        posts:
          one: "%{count} post"
          other: "%{count} posts"
        likes:
          one: "%{count} like"
          other: "%{count} likes"
        days:
          one: "%{count} active day"
          other: "%{count} active days"
        window:
          monthly: "Activity over the last 30 days"
          quarterly: "Activity over the last 3 months"
          yearly: "Activity over the last year"
          all: "All-time activity"
        profile: "View profile"
        since: "Member since %{date}"
        cta_empty: "Post and take part this month to show up here"
        cta_empty_button: "Write a post"
  # The page an anonymous visitor reaches (login_required is on) and the help
  # under the /login form. Registration is closed: these strings are all that
  # explains what the community is and how to get in.
  login_landing:
    title: "The online community of Gestiona certified users"
    subtitle: "Share experience, solve doubts and keep learning with other professionals and with the team of Gestiona specialists"
    cta: "Enter the community"
    restricted: "Access exclusive to Gestiona certified users"
    inside:
      title: "What you will find inside"
      rooms:
        title: "Your certification's forums"
        body: "One space per programme, shared with those who took it with you."
      events:
        title: "Agenda and events"
        body: "Sessions, conferences and community meetings."
      ideas:
        title: "Ideas and resources"
        body: "Improvement proposals, podcast and newsletter."
  login_help:
    title: "Can't access?"
    no_account:
      title: "Enrolled in a certification and can't access your account?"
      body: "Write to us at"
    certify:
      title: "Want to earn a certification?"
      link: "Discover Gestiona certifications"
