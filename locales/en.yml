en:
  theme_metadata:
    description: "Custom Discourse theme for the es|public community."
    settings:
      hero_default_category_id: "Category the 'New post' button preselects on the homepage and the generic listings. A category page uses its own instead. 0 falls back to Discourse's default composer category."
      latest_count: "How many topics to show in the latest list."
      events_category_id: "Category shown in the events lane in the panel. Its subcategories are included. 0 hides the lane."
      events_count: "How many events to show in the panel lane."
      ideas_category_id: "Category shown in the panel beside the latest list. Its subcategories are included. 0 hides it."
      panel_ideas_count: "How many ideas to show in the panel beside the latest list."
      academy_url: "Where the Academy item in the site header points. External destinations must include the scheme — https://example.com, not example.com, which the browser resolves as a path on this site. Start with / for a page on this forum. Empty hides the item."
      demo_url: "Where the Demo Gestiona item in the site header points. External destinations must include the scheme — https://example.com, not example.com, which the browser resolves as a path on this site. Start with / for a page on this forum. Empty hides the item."
      first_steps_url: "Where the first steps item in the site header points. External destinations must include the scheme — https://example.com, not example.com, which the browser resolves as a path on this site. Start with / for a page on this forum. Empty hides the item."
      highlights_podcast_tag: "Tag whose most recent topic fills the podcast card. Matched by slug. Empty hides the card."
      highlights_newsletter_tag: "Tag whose most recent topic fills the newsletter card. Matched by slug. Empty hides the card."
      highlights_news_tag: "Tag whose most recent topic fills the 'What's new in Gestiona' card. Matched by slug. Empty hides the card."
      highlights_member_period: "Window for the most-active-member ranking. 'monthly' is the last 30 days — Discourse has no calendar-month option."

  header:
    links:
      aria_label: "Featured links"
      academy: "Academy"
      demo: "Demo Gestiona"
      first_steps: "First steps"

  topbar:
    stats:
      aria_label: "Community activity"
      # Stated once, in front of the two 30-day figures. Each of those used
      # to carry its own "this month", which repeated the phrase and still
      # left the active-users figure unqualified.
      period_label: "This month:"
      period_aria_label: "Activity this month"
      members:
        one: "member"
        other: "members"
      # The lifetime count of listable topics — what a reader can actually
      # reach, which is why it is worth stating next to the member count.
      topics:
        one: "topic"
        other: "topics"
      active:
        one: "active user"
        other: "active users"
      # "messages" and not "replies": the stat behind it is a bare Post query
      # that includes private messages and restricted categories, so "replies"
      # would be a claim the number cannot support.
      posts:
        one: "message"
        other: "messages"

  # The heading band at the top of the homepage and every listing. A category
  # page overrides both strings with its own name and description, so these are
  # the fallback the community sees on /latest, /top and /unread.
  hero:
    home:
      title: "We keep learning together"
      subtitle: "Share your ideas or get advice from other certified users"
    tag:
      title: "Topics tagged %{tag}"
      subtitle: "Everything the community has filed under this tag"
    button: "New post"

  homepage:
    latest:
      title: "Latest posts"
      link_text: "See all"
      empty: "Nothing new yet."
    events:
      title: "What's on"
      link_text: "See the calendar"
      empty: "No events scheduled."
      # Group headings. The lane is a record as much as an announcement, so
      # both halves are labelled rather than merged into one undated run.
      upcoming: "Coming up"
      past: "Past events"
    ideas:
      title: "Ideas from the community"
      link_text: "Share an idea"
      empty: "No ideas yet."
    # Rendered by BlockForum for the ideas lane. `empty` is the component's arg
    # default (the ideas lane overrides it with `ideas.empty`); `replies` is
    # read straight from the template.
    forum:
      empty: "No conversations yet."
      replies:
        one: "%{count} reply"
        other: "%{count} replies"
    highlights:
      title: "Community highlights"
      soon: "Coming soon"
      podcast:
        label: "Podcast"
        cta: "Watch the episode"
        play: "Play the episode"
      newsletter:
        label: "Newsletter"
        cta: "Read the newsletter"
      news:
        label: "The latest from Gestiona"
        cta: "See what's new"
      member:
        badge: "Featured certified member"
        posts:
          one: "%{count} post"
          other: "%{count} posts"
        likes:
          one: "%{count} like"
          other: "%{count} likes"
        days:
          one: "%{count} active day"
          other: "%{count} active days"
        profile: "View profile"
        cta_empty: "Post and take part this month to show up here"
        cta_empty_button: "Write a post"
